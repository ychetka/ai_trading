# [DECOMMISSIONED ingress — SNI multiplexer on :8444, kept for history]
verbose-config: 0;
verbose-connections: 0;

listen: (
  { host: "0.0.0.0"; port: "8444"; }
);

protocols: (
  {
    name: "tls";
    host: "127.0.0.1";
    port: "8443";
    sni_hostnames: [ "your-domain.example" ];
    log_level: 1;
  },
  {
    name: "anyprot";
    host: "192.168.0.1";
    port: "443";
    log_level: 1;
  }
);

timeout: 5;
on-timeout: "anyprot";
