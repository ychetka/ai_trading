name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: ruff check
        run: uvx ruff@0.17.3 check .

      - name: ruff format check
        run: uvx ruff@0.17.3 format --check .

      - name: eslint (tools/)
        run: npx -y eslint@10.13.0 tools/

      - name: license header check
        shell: bash
        run: |
          # Every published source file must start with the CC BY-NC header
          # (within the first 20 lines, after shebang/version lines).
          missing=0
          while IFS= read -r f; do
            if ! head -20 "$f" | grep -q 'CC BY-NC'; then
              echo "missing license header: $f"
              missing=1
            fi
          done < <(git ls-files 'tools/*.js' 'tools/*.sh' 'docker-static/*.py' '.github/workflows/*')
          exit $missing
